name: Deploy IDS Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy through VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.KEY_VPS_RANDY }}

          script: |
            echo "Connected to VPS"
            /opt/ids-srv-scripts/deploy-ids.sh

# Tes otentikasi vps->gtx
