# Konfigurasi Streamlit tingkat proyek (dibaca dari CWD saat `streamlit run`,
# dan menang atas ~/.streamlit/config.toml).
#
# maxUploadSize hanya membatasi `st.file_uploader`: berkas pipeline (.py) dan
# dataset uji coba (paling besar 25 MB). Uploader bawaan menahan berkasnya
# UTUH di RAM, jadi batasnya sengaja kecil. Dataset besar (sampai 20 GB) tidak
# lewat sini: ia diunggah bertahap lewat rute /ids-upload
# (orchestrator/chunked_upload.py, dipasang di ui/serve.py).
[server]
maxUploadSize = 200         # MB

[browser]
gatherUsageStats = false
